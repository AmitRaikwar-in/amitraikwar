<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Portfolio website for software engineer, web developer, and Mobile app developer | Amit Raikwar"
    />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Amit Raikwar | Portfolio</title>
    <style>
      body::after {
        content: '';
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 9999;
        background-image: url('%PUBLIC_URL%/noise.webp');
        background-size: 15%;
        opacity: 0.05;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <!-- CSS-only premium placeholder loader -->
    <style>
      .preloader-wrapper {
        position: fixed;
        inset: 0;
        background-color: #070509;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        padding: 80px 24px;
        z-index: 99999;
        font-family: 'Space Mono', Consolas, Monaco, monospace;
        overflow: hidden;
        box-sizing: border-box;
        transition:
          opacity 0.8s cubic-bezier(0.76, 0, 0.24, 1),
          visibility 0.8s;
      }
      .preloader-wrapper.preloader-fade-out {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .preloader-glow {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 400px;
        height: 400px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(138, 43, 226, 0.15) 0%,
          rgba(6, 182, 212, 0.05) 50%,
          rgba(0, 0, 0, 0) 70%
        );
        filter: blur(50px);
        animation: pulseGlow 4s ease-in-out infinite;
        pointer-events: none;
      }
      .preloader-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-top: auto;
        margin-bottom: auto;
        z-index: 2;
      }
      .hologram-container {
        position: relative;
        width: 120px;
        height: 120px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 32px;
      }
      .hologram-ring {
        position: absolute;
        border-radius: 50%;
        border-style: dashed;
        box-sizing: border-box;
      }
      .hologram-ring-outer {
        inset: 0;
        border-width: 2px;
        border-color: rgba(138, 43, 226, 0.4);
        animation: rotateClockwise 12s linear infinite;
      }
      .hologram-ring-inner {
        inset: 16px;
        border-width: 1.5px;
        border-color: rgba(6, 182, 212, 0.4);
        animation: rotateCounterClockwise 8s linear infinite;
      }
      .hologram-core {
        position: absolute;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: linear-gradient(135deg, #8a2be2 0%, #06b6d4 100%);
        box-shadow:
          0 0 20px rgba(138, 43, 226, 0.8),
          0 0 40px rgba(6, 182, 212, 0.4);
        animation: pulseCore 2.5s ease-in-out infinite;
      }
      .preloader-title {
        font-size: clamp(1rem, 5vw, 1.35rem);
        font-weight: 800;
        color: #ffffff;
        letter-spacing: 0.25em;
        margin-bottom: 16px;
        text-transform: uppercase;
        background: linear-gradient(
          90deg,
          #ffffff 0%,
          rgba(255, 255, 255, 0.7) 100%
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
        animation: fadeTitle 1.5s ease-out forwards;
      }
      .preloader-status {
        font-size: 0.75rem;
        font-weight: 700;
        color: #06b6d4;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        display: flex;
        align-items: center;
        opacity: 0.85;
      }
      .status-dots {
        margin-left: 2px;
        animation: blinkDots 1.5s step-start infinite;
      }
      .preloader-footer {
        font-size: 0.65rem;
        font-weight: bold;
        letter-spacing: 0.25em;
        color: rgba(138, 43, 226, 0.5);
        text-transform: uppercase;
        z-index: 2;
      }
      @keyframes pulseGlow {
        0%,
        100% {
          transform: translate(-50%, -50%) scale(1);
          opacity: 0.6;
        }
        50% {
          transform: translate(-50%, -50%) scale(1.2);
          opacity: 0.9;
        }
      }
      @keyframes rotateClockwise {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes rotateCounterClockwise {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(-360deg);
        }
      }
      @keyframes pulseCore {
        0%,
        100% {
          transform: scale(0.9);
          opacity: 0.8;
          box-shadow:
            0 0 15px rgba(138, 43, 226, 0.6),
            0 0 30px rgba(6, 182, 212, 0.3);
        }
        50% {
          transform: scale(1.1);
          opacity: 1;
          box-shadow:
            0 0 25px rgba(138, 43, 226, 0.9),
            0 0 50px rgba(6, 182, 212, 0.5);
        }
      }
      @keyframes fadeTitle {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes blinkDots {
        0%,
        100% {
          opacity: 0.2;
        }
        33% {
          opacity: 0.6;
        }
        66% {
          opacity: 1;
        }
      }
    </style>
    <div id="preloader" class="preloader-wrapper">
      <div class="preloader-glow"></div>
      <div class="preloader-content">
        <div class="hologram-container">
          <div class="hologram-ring hologram-ring-outer"></div>
          <div class="hologram-ring hologram-ring-inner"></div>
          <div class="hologram-core"></div>
        </div>
        <div class="preloader-title">SHIELD_OS // COGNITIVE_BOOT</div>
        <div class="preloader-status">
          <span>CONNECTING_TO_CORE</span><span class="status-dots">...</span>
        </div>
      </div>
      <div class="preloader-footer">[SECURE_CHANNEL_INITIATED]</div>
    </div>
    <div id="root"></div>
  </body>
</html>
